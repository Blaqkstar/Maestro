<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maestro - Chat</title>
    <style>
      :root {
        --bg: #09090b;
        --bg-2: #18181b;
        --bg-3: #27272a;
        --border: #27272a;
        --text: #fafafa;
        --text-2: #a1a1aa;
        --text-3: #71717a;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --purple: #a855f7;
        --blue: #3b82f6;
        --pink: #ec4899;
        --code-bg: #0c0c0f;
        --radius: 8px;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono:
          "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.6;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      #sidebar {
        width: 260px;
        flex-shrink: 0;
        background: var(--bg-2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar.hidden {
        display: none;
      }
      #sidebar header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
      }
      #new-chat {
        flex: 1;
        background: var(--accent);
        border: none;
        color: white;
        padding: 10px;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 500;
        font-family: inherit;
        font-size: 13px;
      }
      #new-chat:hover {
        background: var(--accent-hover);
      }

      #session-search-wrap {
        padding: 8px 8px 0 8px;
      }
      #session-search {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 10px;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 12px;
        outline: none;
      }
      #session-search:focus {
        border-color: var(--accent);
      }
      #session-search::placeholder {
        color: var(--text-3);
      }

      #session-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .session-item {
        padding: 10px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        margin-bottom: 4px;
        border: 1px solid transparent;
        position: relative;
      }
      .session-item:hover {
        background: var(--bg-3);
      }
      .session-item.active {
        background: var(--bg-3);
        border-color: var(--border);
      }
      .session-item .title {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 28px;
      }
      .session-item .meta {
        font-size: 11px;
        color: var(--text-3);
        margin-top: 2px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .session-item .mode-badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .mode-badge.plan {
        background: rgba(168, 85, 247, 0.15);
        color: var(--purple);
      }
      .mode-badge.code,
      .mode-badge.act {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .mode-badge.copy {
        background: rgba(236, 72, 153, 0.15);
        color: var(--pink);
      }
      .session-delete {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        padding: 4px;
        display: none;
        font-size: 14px;
      }
      .session-item:hover .session-delete {
        display: block;
      }
      .session-delete:hover {
        color: var(--red);
      }

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      #chat-header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-2);
      }

      #sidebar-toggle {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #sidebar-toggle:hover {
        background: var(--bg-3);
        color: var(--text);
      }

      #chat-title {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
        cursor: pointer;
      }
      #chat-title:hover {
        color: var(--text-2);
      }

      #mode-toggle {
        display: flex;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      #mode-toggle button {
        padding: 6px 14px;
        border: none;
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #mode-toggle button:hover {
        color: var(--text);
      }
      #mode-toggle button.active {
        background: var(--bg-3);
        color: var(--text);
      }
      #mode-toggle button[data-mode="plan"].active {
        color: var(--purple);
      }
      #mode-toggle button[data-mode="code"].active {
        color: var(--green);
      }
      #mode-toggle button[data-mode="copy"].active {
        color: var(--pink);
      }

      #header-actions {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        background: var(--bg-3);
        color: var(--text);
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }

      .msg {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg.user {
        align-items: flex-end;
      }
      .msg.user .bubble {
        background: var(--accent);
        color: white;
        padding: 10px 14px;
        border-radius: 14px 14px 4px 14px;
        max-width: 80%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.assistant .bubble {
        background: var(--bg-2);
        border: 1px solid var(--border);
        padding: 14px 18px;
        border-radius: 4px 14px 14px 14px;
        width: 100%;
        word-break: break-word;
      }
      .msg.system .bubble {
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--text-3);
        padding: 8px 12px;
        border-radius: var(--radius);
        font-size: 12px;
        font-style: italic;
        text-align: center;
        margin: 0 auto;
        max-width: 500px;
      }

      .msg-meta {
        display: flex;
        gap: 8px;
        font-size: 11px;
        color: var(--text-3);
        align-items: center;
      }
      .msg-meta .msg-actions {
        display: none;
        gap: 4px;
      }
      .msg:hover .msg-meta .msg-actions {
        display: flex;
      }
      .msg-action {
        background: transparent;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .msg-action:hover {
        background: var(--bg-3);
        color: var(--text);
      }
      .msg-tokens {
        font-family: var(--mono);
        color: var(--text-3);
        font-size: 10px;
      }

      .thinking {
        background: rgba(168, 85, 247, 0.05);
        border: 1px solid rgba(168, 85, 247, 0.2);
        border-radius: var(--radius);
        margin-bottom: 10px;
        overflow: hidden;
        font-size: 13px;
      }
      .thinking-header {
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        color: var(--purple);
      }
      .thinking-header:hover {
        background: rgba(168, 85, 247, 0.08);
      }
      .thinking-icon {
        display: inline-block;
        animation: spin 1s linear infinite;
      }
      .thinking[data-state="done"] .thinking-icon {
        animation: none;
        color: var(--text-3);
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .thinking-label {
        flex: 1;
        font-weight: 500;
      }
      .thinking-time {
        font-size: 11px;
        color: var(--text-3);
      }
      .thinking-toggle {
        background: transparent;
        border: none;
        color: var(--purple);
        cursor: pointer;
        font-size: 12px;
        padding: 0 4px;
        transition: transform 0.15s;
      }
      .thinking[data-state="done"] .thinking-toggle {
        color: var(--text-3);
      }
      .thinking[data-collapsed="true"] .thinking-toggle {
        transform: rotate(-90deg);
      }
      .thinking-body {
        padding: 0 12px 12px 12px;
        color: var(--text-2);
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
        max-height: 400px;
        overflow-y: auto;
      }
      .thinking[data-collapsed="true"] .thinking-body {
        display: none;
      }

      .tool-call {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        margin: 4px 4px 4px 0;
        font-family: var(--mono);
        color: var(--text-2);
      }
      .tool-call .tool-icon {
        color: var(--blue);
      }
      .tool-call.error {
        border-color: var(--red);
        color: var(--red);
      }
      .tool-call .tool-size {
        color: var(--text-3);
        font-size: 11px;
      }

      .critic-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(168, 85, 247, 0.08);
        border: 1px solid rgba(168, 85, 247, 0.25);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        margin: 4px 4px 4px 0;
        color: var(--purple);
        font-family: var(--font);
      }
      .critic-chip .critic-spin {
        display: inline-block;
        animation: spin 1s linear infinite;
      }
      .critic-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .critic-badge.approved {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .critic-badge.rejected {
        background: rgba(234, 179, 8, 0.15);
        color: var(--yellow);
      }
      .critic-badge.skipped {
        background: var(--bg-3);
        color: var(--text-3);
      }

      .critic-concerns {
        background: rgba(234, 179, 8, 0.06);
        border: 1px solid rgba(234, 179, 8, 0.3);
        border-radius: var(--radius);
        padding: 10px 14px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--yellow);
      }
      .critic-concerns strong {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 8px;
      }
      .status-pill.plan_ready {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .status-pill.need_info {
        background: rgba(234, 179, 8, 0.15);
        color: var(--yellow);
      }
      .status-pill.options {
        background: rgba(59, 130, 246, 0.15);
        color: var(--blue);
      }
      .status-pill.unknown,
      .status-pill.no_patches {
        background: var(--bg-3);
        color: var(--text-3);
      }

      .plan-to-act-wrap {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn-plan-to-act {
        background: var(--green);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        font-family: inherit;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-plan-to-act:hover {
        background: #16a34a;
      }
      .plan-to-act-hint {
        font-size: 12px;
        color: var(--text-3);
      }

      .patch-preview {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-top: 12px;
        overflow: hidden;
      }
      .patch-header {
        padding: 10px 14px;
        background: var(--bg-3);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .patch-header h4 {
        margin: 0;
        font-size: 13px;
        flex: 1;
        min-width: 150px;
      }
      .patch-actions {
        display: flex;
        gap: 6px;
      }
      .btn-apply {
        background: var(--green);
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-family: inherit;
        font-size: 12px;
      }
      .btn-apply:hover {
        background: #16a34a;
      }
      .btn-apply.warn {
        background: var(--yellow);
        color: #1a1a1a;
      }
      .btn-apply.warn:hover {
        background: #ca8a04;
      }
      .btn-reject {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      .btn-reject:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .patch-diff {
        padding: 12px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        overflow-x: auto;
        max-height: 500px;
        overflow-y: auto;
      }
      .patch-diff .diff-add {
        color: var(--green);
      }
      .patch-diff .diff-del {
        color: var(--red);
      }
      .patch-diff .diff-hunk {
        color: var(--blue);
      }
      .patch-diff .diff-file {
        color: var(--purple);
        font-weight: 600;
      }
      .patch-errors {
        padding: 12px 14px;
        background: rgba(239, 68, 68, 0.08);
        border-top: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--red);
        font-size: 12px;
        font-family: var(--mono);
      }

      .bubble h1,
      .bubble h2,
      .bubble h3,
      .bubble h4,
      .bubble h5,
      .bubble h6 {
        margin: 12px 0 6px 0;
        font-weight: 600;
        line-height: 1.3;
      }
      .bubble h3 {
        font-size: 15px;
      }
      .bubble h4 {
        font-size: 14px;
      }
      .bubble p {
        margin: 6px 0;
      }
      .bubble p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .bubble ul,
      .bubble ol {
        margin: 6px 0;
        padding-left: 24px;
      }
      .bubble li {
        margin: 2px 0;
      }
      .bubble a {
        color: var(--accent);
        text-decoration: none;
      }
      .bubble a:hover {
        text-decoration: underline;
      }
      .bubble code {
        background: var(--code-bg);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--purple);
      }
      .bubble pre.code-block {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        overflow-x: auto;
        margin: 8px 0;
        position: relative;
      }
      .bubble pre.code-block code {
        background: transparent;
        padding: 0;
        color: var(--text);
      }
      .code-copy {
        position: absolute;
        top: 8px;
        right: 8px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text-2);
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.15s;
        font-family: var(--font);
      }
      .bubble pre.code-block:hover .code-copy {
        opacity: 1;
      }
      .code-copy:hover {
        color: var(--text);
      }
      .marker {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: var(--blue);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
      }

      #input-area {
        border-top: 1px solid var(--border);
        background: var(--bg-2);
        padding: 12px 20px 16px;
        position: relative;
      }
      #input-wrap {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        transition: border-color 0.15s;
      }
      #input-wrap:focus-within {
        border-color: var(--accent);
      }
      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        line-height: 1.5;
        resize: none;
        outline: none;
        max-height: 240px;
        min-height: 24px;
        padding: 2px 0;
      }
      #input::placeholder {
        color: var(--text-3);
      }
      #mic-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #mic-btn:hover {
        background: var(--bg-3);
        color: var(--text);
      }
      #mic-btn.recording {
        background: var(--red);
        border-color: var(--red);
        color: white;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
        }
      }
      #send-btn,
      #stop-btn {
        border: none;
        color: white;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #send-btn {
        background: var(--accent);
      }
      #send-btn:hover {
        background: var(--accent-hover);
      }
      #send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #stop-btn {
        background: var(--red);
        display: none;
      }
      #stop-btn:hover {
        background: #dc2626;
      }
      #input-hint {
        max-width: 900px;
        margin: 6px auto 0;
        font-size: 11px;
        color: var(--text-3);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #input-hint kbd {
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-2);
      }
      #token-counter {
        font-family: var(--mono);
        color: var(--text-3);
        font-size: 11px;
        white-space: nowrap;
      }

      #autocomplete {
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        margin-bottom: 8px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        max-height: 220px;
        overflow-y: auto;
        display: none;
        z-index: 60;
      }
      #autocomplete.show {
        display: block;
      }
      .ac-item {
        padding: 8px 12px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-2);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ac-item:hover,
      .ac-item.selected {
        background: var(--bg-3);
        color: var(--text);
      }
      .ac-item .ac-icon {
        color: var(--blue);
      }

      #settings {
        position: fixed;
        top: 0;
        right: 0;
        width: 360px;
        height: 100vh;
        background: var(--bg-2);
        border-left: 1px solid var(--border);
        z-index: 100;
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      #settings.open {
        transform: translateX(0);
      }
      #settings header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #settings header h2 {
        margin: 0;
        font-size: 15px;
      }
      #settings-close {
        background: transparent;
        border: none;
        color: var(--text-2);
        font-size: 20px;
        cursor: pointer;
        padding: 0;
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      #settings-close:hover {

      }
      #settings form {
        padding: 16px;
        display: flex;
        flex-direction: column;

      }
      .field {

        flex-direction: column;

      }
      .field label {
        font-size: 12px;
        color: var(--text-2);
        font-weight: 500;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 13px;
        outline: none;

      .field input:focus,
      .field select:focus {
        border-color: var(--accent);
      }
      .field input[type="range"] {
        width: 100%;
      }
      .field-row {
        display: flex;

        align-items: center;

      .field-row label {
        flex: 1;

      .value-display {
        font-family: var(--mono);

      .checkbox-field input {

      .field-hint {
        font-size: 11px;
        color: var(--text-3);
        margin-top: -2px;
      }
      #settings-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99;
        display: none;
      }
      #settings-backdrop.open {
        display: block;

      #scroll-bottom {
        position: absolute;

      #new-chat-modal {

      }

        color: var(--text);
        margin: 0 0 8px 0;

      }

      }
      .empty-state .kbd-hint {
        margin-top: 16px;

      .empty-state kbd {
        background: var(--bg-3);

      @media (max-width: 768px) {
        #app {
          grid-template-columns: 1fr;
        }
        #sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 280px;
          z-index: 90;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }
        #sidebar.mobile-open {
          transform: translateX(0);
        }
        #sidebar.hidden {
          display: flex;
          transform: translateX(-100%);

        #mode-toggle button {

          font-size: 11px;
        }

        }
        #settings {
          width: 100%;
